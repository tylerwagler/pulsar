# Every test tier's one list: what runs, in what order, and what it is allowed to cost (L357).
#
#   check    no GPU, no model time: beside production, every commit
#   kernels  a GPU, no model
#   release  real models, production down; `tests/run.py release` runs every tier, in this order
#
# overlap = true: during `release` the test runs in the background alongside the runner, which is the long GPU tail.
# budget is seconds; a test over budget is flagged, not failed.  [sections] budgets what one test reports for each model.

[limits]
release = 3600   # L357 2026-11-08: #676 measured 3446 s (21 -> 11 server starts; Gemma + Nemotron reference gates added)

[sections]
"cuda-runner-gate [Qwen4-exp]" = 1200
"cuda-runner-gate [Nemotron-H]" = 450   # its two reference gates since L357 (#676: 409 s)
"cuda-runner-gate [Gemma 4]" = 90
"live-legs [qwen]" = 1500
"live-legs [nemotron]" = 420

[[test]]
name = "warnings-gate"
tier = "check"
budget = 150   # L357 2026-11-08: the engine + every test program (Sparky #676: 89 s)

